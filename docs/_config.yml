title: VexelRay
description: >-
  Desktop applications built on the VexelRay stack, and the framework they are
  built with.

# The documents carry no front matter; these plugins (all on by default under
# GitHub Pages) render them anyway, title each page from its first heading,
# rewrite links between .md files to the .html pages they become, and serve a
# folder's README.md as its page when it has no index.md.
plugins:
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-relative-links
  - jekyll-readme-index

relative_links:
  enabled: true

titles_from_headings:
  strip_title: false
